name: SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    name: SonarCloud Analysis

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libboost-json-dev lcov

      - name: Configure
        run: >
          cmake -S . -B build
          -DODTE_COVERAGE=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Generate coverage report
        run: |
          cd build
          lcov --capture --directory CMakeFiles/odte.dir --output-file coverage.info --ignore-errors empty,unused
          lcov --remove coverage.info '*/_deps/*' --output-file coverage.info --ignore-errors unused
          lcov --list coverage.info

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
